<style>
:root{--primary:#0b6b3a;--primary-dark:#084d29;--accent:#f0b429;--bg:#f5f7fa;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--danger:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
body.lang-ur{font-family:'Noto Nastaliq Urdu','Noto Sans',Tahoma,sans-serif;line-height:2.2}
body.lang-hi{font-family:'Noto Sans Devanagari','Noto Sans',Tahoma,sans-serif}
body[dir="rtl"]{direction:rtl}
body[dir="rtl"] th,body[dir="rtl"] td{text-align:right}
body[dir="rtl"] .brand{flex-direction:row-reverse}
body[dir="rtl"] .toolbar{flex-direction:row-reverse}

/* Login */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0b6b3a,#084d29)}
.login-card{background:#fff;padding:32px;border-radius:16px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-logo{width:80px;height:80px;background:var(--accent);border-radius:16px;display:grid;place-items:center;font-weight:800;color:var(--primary-dark);font-size:24px;margin:0 auto 16px}
.login-card h1{text-align:center;font-size:20px;margin-bottom:4px;color:var(--primary-dark)}
.login-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
.login-card .lang-switch{display:flex;justify-content:center;gap:8px;margin-bottom:16px}
.lang-switch button{padding:6px 14px;border:1px solid var(--border);background:#fff;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600}
.lang-switch button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.login-hint{text-align:center;font-size:12px;color:var(--muted);margin-top:16px;padding:10px;background:#f0fdf4;border-radius:8px}
.login-err{color:var(--danger);font-size:13px;text-align:center;margin-top:10px;min-height:20px}

/* App header */
header.app-header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:52px;height:52px;background:var(--accent);border-radius:12px;display:grid;place-items:center;font-weight:800;color:var(--primary-dark);font-size:18px;letter-spacing:1px}
.brand h1{font-size:18px;font-weight:800}
.brand p{font-size:12px;opacity:.9}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.user-chip{background:rgba(255,255,255,.2);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600}
.lang-mini{display:flex;gap:4px}
.lang-mini button{padding:4px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;cursor:pointer;font-size:11px;font-weight:600}
.lang-mini button.active{background:#fff;color:var(--primary-dark)}
.btn-logout{padding:6px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;cursor:pointer;font-size:12px;font-weight:600}

nav.tabs{display:flex;gap:6px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:0;z-index:50;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.tab{padding:9px 14px;border-radius:8px;border:none;background:transparent;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap;font-size:13px;font-family:inherit}
.tab.active{background:var(--primary);color:#fff}
.tab:hover:not(.active){background:#eef2f7;color:var(--text)}

main{padding:20px;max-width:1200px;margin:0 auto}
section.page{display:none}
section.page.active{display:block}
.card{background:var(--card);border-radius:12px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.05);border:1px solid var(--border);margin-bottom:16px}
.card h2{font-size:17px;margin-bottom:12px;color:var(--primary-dark)}
.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.stat{background:#fff;border-left:4px solid var(--primary);padding:14px;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
body[dir="rtl"] .stat{border-left:none;border-right:4px solid var(--primary)}
.stat .num{font-size:22px;font-weight:800;color:var(--primary-dark)}
.stat .label{font-size:12px;color:var(--muted);margin-top:2px}

label.field{display:block;margin-bottom:10px;font-size:13px;color:var(--muted);font-weight:600}
input,select,textarea{width:100%;padding:9px 12px;margin-top:4px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:transparent}

button.btn{padding:10px 18px;border-radius:8px;border:none;background:var(--primary);color:#fff;font-weight:600;cursor:pointer;font-size:14px;font-family:inherit}
button.btn:hover{background:var(--primary-dark)}
button.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--primary)}
button.btn.ghost:hover{background:#e8f4ec}
button.btn.danger{background:var(--danger)}
button.btn.danger:hover{background:#b91c1c}
button.btn.small{padding:6px 12px;font-size:12px}
button.btn.gold{background:var(--accent);color:var(--primary-dark)}
button.btn.gold:hover{background:#d9a41f}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border)}
th{background:#f9fafb;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
tr:hover td{background:#fafbfc}
.empty{text-align:center;color:var(--muted);padding:24px;font-style:italic}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}

.att-toggle{display:inline-flex;gap:4px}
.att-toggle button{padding:5px 10px;font-size:12px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;font-weight:600}
.att-toggle button.on-present{background:#16a34a;color:#fff;border-color:#16a34a}
.att-toggle button.on-absent{background:#dc2626;color:#fff;border-color:#dc2626}
.att-toggle button.on-leave{background:#d97706;color:#fff;border-color:#d97706}
.att-status-print{display:none}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.toolbar label.field{margin-bottom:0;flex:1;min-width:130px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.footer-note{text-align:center;color:var(--muted);font-size:12px;padding:20px}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:200;padding:20px}
.modal{background:#fff;border-radius:12px;padding:22px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h3{margin-bottom:14px;color:var(--primary-dark)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}

.print-school-header{display:none;text-align:center;margin-bottom:16px;border-bottom:2px solid var(--primary);padding-bottom:10px}
.print-school-header h1{font-size:20px;color:var(--primary-dark)}
.print-school-header p{font-size:12px;color:var(--muted)}

/* Receipt */
.receipt{border:2px solid var(--primary);border-radius:10px;padding:18px;max-width:500px;margin:10px auto;background:#fff}
.receipt-head{text-align:center;border-bottom:2px dashed var(--primary);padding-bottom:8px;margin-bottom:12px}
.receipt-head h3{color:var(--primary-dark);font-size:16px}
.receipt-head .sub{font-size:11px;color:var(--muted)}
.receipt-body{font-size:13px}
.receipt-body .line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dotted var(--border)}
.receipt-body .line strong{color:var(--primary-dark)}
.receipt-total{margin-top:12px;padding:10px;background:#f0fdf4;border-radius:8px;text-align:center;font-size:16px;font-weight:800;color:var(--primary-dark)}
.receipt-foot{margin-top:20px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.receipt-no{text-align:center;font-size:11px;color:var(--muted);margin-top:8px}

@media print{
  body.printing header.app-header,body.printing nav.tabs,body.printing .no-print{display:none!important}
  body.printing .page:not(.print-target){display:none!important}
  body.printing .page.print-target{display:block!important}
  body.printing .toolbar,body.printing .row-actions,body.printing .footer-note{display:none!important}
  body.printing main{padding:0;max-width:100%}
  body.printing .card{box-shadow:none;border:none;padding:0;margin:0}
  body.printing .print-school-header{display:block!important}
  body.printing .att-toggle{display:none}
  body.printing .att-status-print{display:inline!important;font-weight:600}
  body{background:#fff}
  .receipt{page-break-inside:avoid;box-shadow:none}
}
</style>
</head>

<div id="loginScreen" class="login-wrap">

    <button class="tab" data-page="notes" data-i18n="nav_notes"></button>
    <button class="tab" data-page="timetable" data-i18n="nav_timetable"></button>
  </nav>

  <main>

    <section id="fees" class="page"></section>
    <section id="notes" class="page"></section>
    <section id="timetable" class="page"></section>
  </main>
  <div class="footer-note" id="footerNote"></div>
</div>

let LANG = localStorage.getItem('ips_lang') || 'en';
function T(k){ return (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k; }
function applyLang(){
  document.documentElement.lang = LANG;
  document.body.className = 'lang-' + LANG;
  document.body.dir = (LANG==='ur') ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = T(el.dataset.i18n));
  // Login screen
  document.getElementById('loginTitle').textContent = T('login_title');
  document.getElementById('loginSub').textContent = T('login_sub');
  document.getElementById('lblUser').childNodes[0].textContent = T('username');
  document.getElementById('lblPass').childNodes[0].textContent = T('password');
  document.getElementById('btnLogin').textContent = T('login');
  document.getElementById('loginHint').textContent = T('admin_hint');
  document.querySelectorAll('.lang-switch button, .lang-mini button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === LANG);
  });
  document.getElementById('appTitle').textContent = T('login_title');
  document.getElementById('appSub').textContent = T('app_sub');
  document.getElementById('btnLogout').textContent = T('logout');
  document.getElementById('footerNote').textContent = T('footer');
  if(CURRENT_USER){
    const roleKey = CURRENT_USER.role === 'admin' ? 'role_admin' : 'role_teacher';
    document.getElementById('userChip').textContent = CURRENT_USER.name + ' · ' + T(roleKey);
  }
  // Re-render current page
  const active = document.querySelector('.tab.active');
  if(active) renderPage(active.dataset.page);
}
function setLang(l){ LANG = l; localStorage.setItem('ips_lang', l); applyLang(); }
function setLoginLang(l){ LANG = l; localStorage.setItem('ips_lang', l); applyLang(); }

// ============ Auth ============
const USERS = {
  admin:{password:'admin123',role:'admin',name:'Admin'},
  teacher:{password:'teacher123',role:'teacher',name:'Teacher'}
};
let CURRENT_USER = null;
function doLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr');
  if(USERS[u] && USERS[u].password === p){
    CURRENT_USER = { username:u, role:USERS[u].role, name:USERS[u].name };
    sessionStorage.setItem('ips_user', JSON.stringify(CURRENT_USER));
    err.textContent = '';
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    applyLang();
    renderPage('dashboard');
  } else {
    err.textContent = T('invalid');
  }
}
function doLogout(){
  CURRENT_USER = null;
  sessionStorage.removeItem('ips_user');
  document.getElementById('appScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'grid';
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
}

// ============ Navigation ============
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(t.dataset.page).classList.add('active');
  renderPage(t.dataset.page);
}));
function goPage(p){ document.querySelector('.tab[data-page="'+p+'"]').click(); }

function renderPage(p){
  if(!CURRENT_USER) return;
  if(p==='dashboard') renderDashboard();
  else if(p==='students') renderStudents();
  else if(p==='teachers') renderTeachers();
  else if(p==='attendance') renderAttendance();
  else if(p==='results') renderResults();
  else if(p==='fees') renderFees();
  else if(p==='notes') renderNotes();
  else if(p==='timetable') renderTimetable();
}

// ============ Modal ============
function openModal(html){
  const m = document.createElement('div');
  m.className = 'modal-overlay';
  m.innerHTML = '<div class="modal">'+html+'</div>';
  m.addEventListener('click', e => { if(e.target===m) m.remove(); });
  document.body.appendChild(m);
}

function renderDashboard(){
  const todayAtt = db.attendance[today()] || {};
  const present = Object.values(todayAtt).filter(v=>v==='present').length;
  const marked = Object.keys(todayAtt).length;
  const feesMonth = db.fees.filter(f=>f.date && f.date.startsWith(monthNow())).reduce((a,f)=>a+Number(f.amount||0),0);
  document.getElementById('dashboard').innerHTML =
    '<div class="grid grid-4">' +
    '<div class="stat"><div class="num">'+db.students.length+'</div><div class="label">'+T('students_count')+'</div></div>' +
    '<div class="stat"><div class="num">'+db.teachers.length+'</div><div class="label">'+T('teachers_count')+'</div></div>' +
    '<div class="stat"><div class="num">'+present+'/'+marked+'</div><div class="label">'+T('today_present')+'</div></div>' +
    '<div class="stat"><div class="num">Rs '+feesMonth.toLocaleString()+'</div><div class="label">'+T('fees_month')+'</div></div>' +
    '</div>' +
    '<div class="card"><h2>'+T('quick')+'</h2><div class="grid grid-3">' +
    '<button class="btn ghost" onclick="goPage(\'attendance\')">'+T('mark_att')+'</button>' +
    '<button class="btn ghost" onclick="goPage(\'students\')">'+T('add_student_short')+'</button>' +
    '<button class="btn ghost" onclick="goPage(\'fees\')">'+T('record_fee_short')+'</button>' +
    '</div></div>' +
    '<div class="card"><h2>'+T('recent')+'</h2><div id="dashRecent"></div></div>' +
    '<div class="card"><h2>'+T('backup')+'</h2><div class="grid grid-2">' +
    '<button class="btn ghost" onclick="exportData()">'+T('export')+'</button>' +
    '<button class="btn ghost" onclick="document.getElementById(\'importFile\').click()">'+T('import')+'</button>' +
    '<input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">' +
    '</div><div class="hint">'+T('backup_hint')+'</div></div>';
  const recent = [
    ...db.fees.slice(-3).map(f=>({t:'Fee',txt:(studentById(f.studentId)?.name||'?')+' — Rs '+f.amount,d:f.date})),
    ...db.notes.slice(-3).map(n=>({t:'Note',txt:n.title,d:n.date})),
    ...db.results.slice(-3).map(r=>({t:'Result',txt:r.exam+' — '+(studentById(r.studentId)?.name||'?'),d:r.date}))
  ].sort((a,b)=>(b.d||'').localeCompare(a.d||'')).slice(0,6);
  document.getElementById('dashRecent').innerHTML = recent.length
    ? recent.map(r=>'<div style="padding:10px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;"><span><strong>'+r.t+':</strong> '+r.txt+'</span><span style="color:var(--muted);font-size:12px;">'+(r.d||'')+'</span></div>').join('')
    : '<div class="empty">'+T('no_activity')+'</div>';
}

function renderStudents(){
  document.getElementById('students').innerHTML =
    '<div class="card"><h2>'+T('students')+'</h2>' +
    '<div class="toolbar"><label class="field">'+T('search')+'<input id="stuSearch" oninput="renderStudentTable()"></label>' +
    '<label class="field">'+T('class')+'<select id="stuClassFilter" onchange="renderStudentTable()"><option value="">'+T('all')+'</option>' +
    classes().map(c=>'<option value="'+c+'">'+T('class')+' '+c+'</option>').join('')+'</select></label>' +
    '<button class="btn" onclick="openStudentForm()">'+T('add_student')+'</button></div>' +
    '<div id="studentTable"></div></div>';
  renderStudentTable();
}
function renderStudentTable(){
  const q = (document.getElementById('stuSearch').value||'').toLowerCase();
  const c = document.getElementById('stuClassFilter').value;
  let list = db.students.slice();
  if(q) list = list.filter(s=>s.name.toLowerCase().includes(q)||(s.rollNo||'').includes(q)||(s.phone||'').includes(q));
  if(c) list = list.filter(s=>s.className===c);
  list.sort((a,b)=>(a.className||'').localeCompare(b.className||'')||(a.rollNo||'').localeCompare(b.rollNo||''));
  const el = document.getElementById('studentTable');
  if(!list.length){ el.innerHTML = '<div class="empty">'+T('no_students')+'</div>'; return; }
  el.innerHTML = '<div style="overflow-x:auto;"><table><thead><tr><th>'+T('roll')+'</th><th>'+T('name')+'</th><th>'+T('class')+'</th><th>'+T('father')+'</th><th>'+T('phone')+'</th><th>'+T('fee')+'</th><th>'+T('actions')+'</th></tr></thead><tbody>'+
    list.map(s=>'<tr><td>'+s.rollNo+'</td><td><strong>'+s.name+'</strong></td><td>'+s.className+'-'+s.section+'</td><td>'+(s.fatherName||'-')+'</td><td>'+(s.phone||'-')+'</td><td>Rs '+s.monthlyFee+'</td><td class="row-actions"><button class="btn ghost small" onclick="openStudentForm(\''+s.id+'\')">'+T('edit')+'</button><button class="btn danger small" onclick="deleteStudent(\''+s.id+'\')">'+T('del')+'</button></td></tr>').join('')+
    '</tbody></table></div>';
}
function openStudentForm(id){
  const s = id ? db.students.find(x=>x.id===id) : {};
  openModal('<h3>'+(id?T('edit_student_t'):T('add_student_t'))+'</h3>' +
    '<label class="field">'+T('name')+'<input id="f_name" value="'+(s.name||'')+'"></label>' +
    '<div class="grid grid-2"><label class="field">'+T('father')+'<input id="f_father" value="'+(s.fatherName||'')+'"></label>' +
    '<label class="field">'+T('phone')+'<input id="f_phone" value="'+(s.phone||'')+'"></label></div>' +
    '<div class="grid grid-3"><label class="field">'+T('class')+'<input id="f_class" value="'+(s.className||'')+'"></label>' +
    '<label class="field">'+T('section')+'<input id="f_section" value="'+(s.section||'A')+'"></label>' +
    '<label class="field">'+T('roll')+'<input id="f_roll" value="'+(s.rollNo||'')+'"></label></div>' +
    '<label class="field">'+T('monthly_fee')+'<input type="number" id="f_fee" value="'+(s.monthlyFee||0)+'"></label>' +
    '<div class="modal-actions"><button class="btn ghost" onclick="this.closest(\'.modal-overlay\').remove()">'+T('cancel')+'</button>' +
    '<button class="btn" onclick="saveStudent(\''+(id||'')+'\')">'+T('save')+'</button></div>');
}
function saveStudent(id){
  const data = {
    name:document.getElementById('f_name').value.trim(),
    fatherName:document.getElementById('f_father').value.trim(),
    phone:document.getElementById('f_phone').value.trim(),
    className:document.getElementById('f_class').value.trim(),
    section:document.getElementById('f_section').value.trim()||'A',
    rollNo:document.getElementById('f_roll').value.trim(),
    monthlyFee:Number(document.getElementById('f_fee').value)||0
  };
  if(!data.name || !data.className){ alert(T('req_fields')); return; }
  if(id) Object.assign(db.students.find(s=>s.id===id), data);
  else db.students.push({id:uid('s'),...data});
  save(); document.querySelector('.modal-overlay').remove(); renderStudents();
}
function deleteStudent(id){
  if(!confirm(T('confirm_delete'))) return;
  db.students = db.students.filter(s=>s.id!==id); save(); renderStudentTable();
}

function renderAttendance(){
  const cls = classes();
  if(!attClass) attClass = cls[0] || '';
  document.getElementById('attendance').innerHTML =
    '<div class="card"><h2>'+T('attendance')+'</h2>' +
    '<div class="toolbar"><label class="field">'+T('date')+'<input type="date" value="'+attDate+'" onchange="attDate=this.value; renderAttendance()"></label>' +
    '<label class="field">'+T('class')+'<select onchange="attClass=this.value; renderAttendance()">' +
    (cls.map(c=>'<option value="'+c+'" '+(c===attClass?'selected':'')+'>'+T('class')+' '+c+'</option>').join('') || '<option>--</option>') +
    '</select></label><button class="btn" onclick="markAllPresent()">'+T('all_present')+'</button>' +
    '<button class="btn ghost" onclick="printSection(\'attendance\')">'+T('print')+'</button></div>' +
    '<div id="attList"></div></div>';
  renderAttList();
}
function renderAttList(){
  const students = db.students.filter(s=>s.className===attClass).sort((a,b)=>(a.rollNo||'').localeCompare(b.rollNo||''));
  const el = document.getElementById('attList');
  if(!students.length){ el.innerHTML = '<div class="empty">'+T('no_students_class')+'</div>'; return; }
  const day = db.attendance[attDate] || {};
  el.innerHTML = '<div style="margin-bottom:10px;padding:8px;background:#f9fafb;border-radius:6px;"><strong>'+T('class')+' '+attClass+'</strong> — '+T('date')+': <strong>'+attDate+'</strong></div>' +
    '<div style="overflow-x:auto;"><table><thead><tr><th>'+T('roll')+'</th><th>'+T('name')+'</th><th>'+T('status')+'</th></tr></thead><tbody>' +
    students.map(s=>{
      const st = day[s.id]||'';
      return '<tr><td>'+s.rollNo+'</td><td>'+s.name+'</td><td>'+
        '<div class="att-toggle">' +
        '<button class="'+(st==='present'?'on-present':'')+'" onclick="setAtt(\''+s.id+'\',\'present\')">'+T('present')+'</button>' +
        '<button class="'+(st==='absent'?'on-absent':'')+'" onclick="setAtt(\''+s.id+'\',\'absent\')">'+T('absent')+'</button>' +
        '<button class="'+(st==='leave'?'on-leave':'')+'" onclick="setAtt(\''+s.id+'\',\'leave\')">'+T('leave')+'</button>' +
        '</div><span class="att-status-print">'+(st?T(st):'—')+'</span></td></tr>';
    }).join('') +
    '</tbody></table></div><div class="hint">'+T('auto_saved')+'</div>';
}
function setAtt(sid, status){
  if(!db.attendance[attDate]) db.attendance[attDate] = {};
  db.attendance[attDate][sid] = status; save(); renderAttList();
}
function markAllPresent(){
  const students = db.students.filter(s=>s.className===attClass);
  if(!db.attendance[attDate]) db.attendance[attDate] = {};
  students.forEach(s=>db.attendance[attDate][s.id]='present');
  save(); renderAttList();
}

// ============ Results ============
let resTab = 'entry', resExam = '', resStudent = '', editSubjects = [];
function renderResults(){
  document.getElementById('results').innerHTML =
    '<div class="card"><h2>'+T('results')+'</h2>' +
    '<div class="toolbar no-print">' +
    '<button class="btn '+(resTab==='entry'?'':'ghost')+'" onclick="resTab=\'entry\'; renderResults()">'+T('enter_marks')+'</button>' +
    '<button class="btn '+(resTab==='card'?'':'ghost')+'" onclick="resTab=\'card\'; renderResults()">'+T('result_card')+'</button>' +
    '<button class="btn '+(resTab==='tab'?'':'ghost')+'" onclick="resTab=\'tab\'; renderResults()">'+T('tabulation')+'</button>' +
    '</div><div id="resBody"></div></div>';
  if(resTab==='entry') renderResultEntry();
  else if(resTab==='card') renderResultCard();
  else renderTabulation();
}
function renderResultEntry(){
  document.getElementById('resBody').innerHTML =
    '<div class="toolbar"><label class="field">'+T('exam')+'<input id="resExamName" value="'+resExam+'" placeholder="First Term" oninput="resExam=this.value"></label>' +
    '<label class="field">'+T('student')+'<select id="resStudentSel"><option value="">'+T('select')+'</option>' +
    db.students.map(s=>'<option value="'+s.id+'">'+studentLabel(s)+'</option>').join('') +
    '</select></label><button class="btn" onclick="loadResultForEdit()">'+T('load_new')+'</button></div><div id="resEditor"></div>';
}
function loadResultForEdit(){
  const exam = document.getElementById('resExamName').value.trim();
  const sid = document.getElementById('resStudentSel').value;
  if(!exam || !sid){ alert(T('select_exam_student')); return; }
  resExam = exam; resStudent = sid;
  const ex = db.results.find(r=>r.exam===exam && r.studentId===sid);
  editSubjects = ex ? JSON.parse(JSON.stringify(ex.subjects)) : [
    {name:'Mathematics',total:100,obtained:0},
    {name:'English',total:100,obtained:0},
    {name:'Urdu',total:100,obtained:0}
  ];
  renderEditor();
}
function renderEditor(){
  document.getElementById('resEditor').innerHTML =
    '<div style="overflow-x:auto;"><table><thead><tr><th>'+T('subject_name')+'</th><th>'+T('total')+'</th><th>'+T('obtained')+'</th><th></th></tr></thead><tbody>' +
    editSubjects.map((s,i)=>'<tr><td><input value="'+s.name+'" oninput="editSubjects['+i+'].name=this.value"></td>' +
      '<td><input type="number" value="'+s.total+'" oninput="editSubjects['+i+'].total=Number(this.value)" style="width:90px"></td>' +
      '<td><input type="number" value="'+s.obtained+'" oninput="editSubjects['+i+'].obtained=Number(this.value)" style="width:90px"></td>' +
      '<td><button class="btn danger small" onclick="editSubjects.splice('+i+',1); renderEditor()">×</button></td></tr>').join('') +
    '</tbody></table></div><div style="margin-top:10px;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;">' +
    '<button class="btn ghost small" onclick="editSubjects.push({name:\'\',total:100,obtained:0});renderEditor()">'+T('add_subject')+'</button>' +
    '<button class="btn" onclick="saveResult()">'+T('save_result')+'</button></div>';
}
function saveResult(){
  if(!editSubjects.length){ alert(T('add_at_least_one')); return; }
  const ex = db.results.find(r=>r.exam===resExam && r.studentId===resStudent);
  if(ex){ ex.subjects = JSON.parse(JSON.stringify(editSubjects)); ex.date = today(); }
  else db.results.push({id:uid('r'),exam:resExam,studentId:resStudent,subjects:JSON.parse(JSON.stringify(editSubjects)),date:today()});
  save(); alert(T('saved'));
}
function renderResultCard(){
  const exams = [...new Set(db.results.map(r=>r.exam))];
  document.getElementById('resBody').innerHTML =
    '<div class="toolbar"><label class="field">'+T('exam')+'<select id="cardExam" onchange="renderCardPreview()">' +
    exams.map(e=>'<option>'+e+'</option>').join('')+'</select></label>' +
    '<label class="field">'+T('student')+'<select id="cardStudent" onchange="renderCardPreview()"><option value="">'+T('select')+'</option>' +
    db.students.map(s=>'<option value="'+s.id+'">'+studentLabel(s)+'</option>').join('') +
    '</select></label><button class="btn" onclick="printSection(\'results\')">'+T('print')+'</button></div><div id="cardPreview"></div>';
}
function renderCardPreview(){
  const exam = document.getElementById('cardExam').value;
  const sid = document.getElementById('cardStudent').value;
  const el = document.getElementById('cardPreview');
  if(!exam || !sid){ el.innerHTML=''; return; }
  const r = db.results.find(x=>x.exam===exam && x.studentId===sid);
  if(!r){ el.innerHTML = '<div class="empty">'+T('no_result')+'</div>'; return; }
  el.innerHTML = buildResultCardHTML(r);
}
function getGrade(p){ p=Number(p); if(p>=90)return'A+';if(p>=80)return'A';if(p>=70)return'B';if(p>=60)return'C';if(p>=50)return'D';if(p>=40)return'E';return'F'; }
function getPosition(r){
  const s = studentById(r.studentId); if(!s) return '-';
  const same = db.results.filter(x=>{const st=studentById(x.studentId);return x.exam===r.exam && st && st.className===s.className;});
  const arr = same.map(x=>{const mx=x.subjects.reduce((a,b)=>a+Number(b.total||0),0);const ob=x.subjects.reduce((a,b)=>a+Number(b.obtained||0),0);return{id:x.studentId,pct:mx?ob/mx:0};}).sort((a,b)=>b.pct-a.pct);
  const i = arr.findIndex(x=>x.id===r.studentId);
  return i>=0 ? (i+1)+'/'+arr.length : '-';
}
function buildResultCardHTML(r){
  const s = studentById(r.studentId); if(!s) return '';
  const mx = r.subjects.reduce((a,x)=>a+Number(x.total||0),0);
  const ob = r.subjects.reduce((a,x)=>a+Number(x.obtained||0),0);
  const pct = mx ? ((ob/mx)*100).toFixed(1) : 0;
  const g = getGrade(pct);
  return '<div style="border:2px solid var(--primary);padding:20px;border-radius:10px;">' +
    '<div style="text-align:center;border-bottom:2px solid var(--primary);padding-bottom:10px;margin-bottom:14px;">' +
    '<h2 style="color:var(--primary-dark);">IPS — Iqra Private School, Chapahari</h2>' +
    '<p style="font-size:12px;color:var(--muted);">Smart School Management</p>' +
    '<p style="font-weight:700;margin-top:6px;">'+r.exam+' — '+T('result_card')+'</p></div>' +
    '<table style="margin-bottom:14px;"><tr><td><strong>'+T('name')+':</strong> '+s.name+'</td><td><strong>'+T('class')+':</strong> '+s.className+'-'+s.section+'</td><td><strong>'+T('roll')+':</strong> '+(s.rollNo||'-')+'</td></tr>' +
    '<tr><td colspan="2"><strong>'+T('father')+':</strong> '+(s.fatherName||'-')+'</td><td><strong>'+T('date')+':</strong> '+(r.date||'')+'</td></tr></table>' +
    '<div style="overflow-x:auto;"><table><thead><tr><th>'+T('subject_name')+'</th><th>'+T('total')+'</th><th>'+T('obtained')+'</th><th>'+T('grade')+'</th></tr></thead><tbody>' +
    r.subjects.map(x=>{const p=Number(x.total)?(Number(x.obtained)/Number(x.total)*100):0;return'<tr><td>'+x.name+'</td><td>'+x.total+'</td><td>'+x.obtained+'</td><td>'+getGrade(p)+'</td></tr>';}).join('') +
    '</tbody><tfoot><tr style="font-weight:700;background:#f9fafb;"><td>'+T('total')+'</td><td>'+mx+'</td><td>'+ob+'</td><td>'+g+'</td></tr></tfoot></table></div>' +
    '<div style="margin-top:14px;padding:10px;background:#f0fdf4;border-radius:8px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">' +
    '<span><strong>'+T('percentage')+':</strong> '+pct+'%</span><span><strong>'+T('grade')+':</strong> '+g+'</span><span><strong>'+T('position')+':</strong> '+getPosition(r)+'</span></div>' +
    '<div style="margin-top:30px;display:flex;justify-content:space-between;font-size:12px;"><span>____________________<br>'+T('class_teacher')+'</span><span>____________________<br>'+T('principal')+'</span></div></div>';
}
function renderTabulation(){
  const exams = [...new Set(db.results.map(r=>r.exam))];
  document.getElementById('resBody').innerHTML =
    '<div class="toolbar"><label class="field">'+T('exam')+'<select id="tabExam" onchange="renderTabPreview()">' +
    exams.map(e=>'<option>'+e+'</option>').join('')+'</select></label>' +
    '<label class="field">'+T('class')+'<select id="tabClass" onchange="renderTabPreview()">' +
    classes().map(c=>'<option>'+c+'</option>').join('')+'</select></label>' +
    '<button class="btn" onclick="printSection(\'results\')">'+T('print')+'</button></div><div id="tabPreview"></div>';
  renderTabPreview();
}
function renderTabPreview(){
  const exam = document.getElementById('tabExam')?.value;
  const cls = document.getElementById('tabClass')?.value;
  const el = document.getElementById('tabPreview');
  if(!exam || !cls){ el.innerHTML=''; return; }
  const results = db.results.filter(r=>{const s=studentById(r.studentId);return r.exam===exam && s && s.className===cls;});
  if(!results.length){ el.innerHTML = '<div class="empty">'+T('no_results_class')+'</div>'; return; }
  const subjSet = new Set();
  results.forEach(r=>r.subjects.forEach(x=>subjSet.add(x.name)));
  const subjects = [...subjSet];
  el.innerHTML = '<div style="margin-bottom:10px;"><strong>'+T('exam')+':</strong> '+exam+' · <strong>'+T('class')+':</strong> '+cls+'</div>' +
    '<div style="overflow-x:auto;"><table><thead><tr><th>'+T('roll')+'</th><th>'+T('name')+'</th>' +
    subjects.map(s=>'<th>'+s+'</th>').join('') +
    '<th>'+T('total')+'</th><th>%</th><th>'+T('grade')+'</th></tr></thead><tbody>' +
    results.map(r=>{
      const s = studentById(r.studentId);
      const marks = {}; r.subjects.forEach(x=>marks[x.name]=x.obtained);
      const mx = r.subjects.reduce((a,x)=>a+Number(x.total||0),0);
      const ob = r.subjects.reduce((a,x)=>a+Number(x.obtained||0),0);
      const pct = mx ? (ob/mx*100).toFixed(1) : 0;
      return '<tr><td>'+s.rollNo+'</td><td>'+s.name+'</td>' +
        subjects.map(sub=>'<td>'+(marks[sub] ?? '-')+'</td>').join('') +
        '<td><strong>'+ob+'</strong></td><td>'+pct+'%</td><td>'+getGrade(pct)+'</td></tr>';
    }).join('') + '</tbody></table></div>';
}

function renderFees(){
  document.getElementById('fees').innerHTML =
    '<div class="card"><h2>'+T('fees')+'</h2>' +
    '<div class="toolbar"><label class="field">'+T('student')+'<select id="feeStudent"><option value="">'+T('select')+'</option>' +
    db.students.map(s=>'<option value="'+s.id+'">'+studentLabel(s)+'</option>').join('') +

    '<label class="field">'+T('amount')+'<input type="number" id="feeAmount"></label>' +
    '<label class="field">'+T('date')+'<input type="date" id="feeDate" value="'+today()+'"></label>' +
    '<button class="btn" onclick="addFee()">'+T('add')+'</button></div><div id="feeList"></div></div>';
  renderFeeList();
}
function addFee(){
  const sid = document.getElementById('feeStudent').value;
  const month = document.getElementById('feeMonth').value;
  const amount = Number(document.getElementById('feeAmount').value);
  const date = document.getElementById('feeDate').value;
  if(!sid || !month || !amount){ alert(T('all_fields_req')); return; }
  db.feeCounter = (db.feeCounter||0) + 1;
  const receiptNo = 'IPS-'+new Date().getFullYear()+'-'+String(db.feeCounter).padStart(4,'0');
  db.fees.push({id:uid('f'),studentId:sid,month,amount,date,receiptNo});
  save(); renderFeeList(); document.getElementById('feeAmount').value = '';
}
function renderFeeList(){
  const el = document.getElementById('feeList');
  const list = db.fees.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(!list.length){ el.innerHTML = '<div class="empty">'+T('no_fees')+'</div>'; return; }
  const total = list.reduce((a,f)=>a+Number(f.amount||0),0);
  el.innerHTML = '<div class="hint" style="margin-bottom:8px;">'+T('total_fees')+': <strong>Rs '+total.toLocaleString()+'</strong></div>' +
    '<div style="overflow-x:auto;"><table><thead><tr><th>'+T('receipt_no')+'</th><th>'+T('date')+'</th><th>'+T('student')+'</th><th>'+T('month')+'</th><th>'+T('amount')+'</th><th>'+T('actions')+'</th></tr></thead><tbody>' +
    list.map(f=>'<tr><td>'+(f.receiptNo||'-')+'</td><td>'+f.date+'</td><td>'+(studentById(f.studentId)?.name||'?')+'</td><td>'+f.month+'</td><td>Rs '+Number(f.amount).toLocaleString()+'</td>' +
      '<td class="row-actions"><button class="btn gold small" onclick="showReceipt(\''+f.id+'\')">'+T('print_receipt')+'</button>' +
      '<button class="btn danger small" onclick="deleteFee(\''+f.id+'\')">'+T('del')+'</button></td></tr>').join('') +
    '</tbody></table></div>';
}
function deleteFee(id){
  if(!confirm(T('confirm_delete'))) return;
  db.fees = db.fees.filter(f=>f.id!==id); save(); renderFeeList();
}

// ============ Notes ============
function renderNotes(){
  document.getElementById('notes').innerHTML =
    '<div class="card"><h2>'+T('notes')+'</h2>' +
    '<div class="toolbar"><label class="field">'+T('class')+'<input id="noteClass" placeholder="5 / '+T('all')+'"></label>' +
    '<label class="field">'+T('title')+'<input id="noteTitle"></label></div>' +
    '<label class="field">'+T('details')+'<textarea id="noteBody" rows="2"></textarea></label>' +
    '<button class="btn" onclick="addNote()">'+T('add_note')+'</button>' +
    '<div id="notesList" style="margin-top:14px;"></div></div>';
  renderNotesList();
}
function addNote(){
  const title = document.getElementById('noteTitle').value.trim();
  const body = document.getElementById('noteBody').value.trim();
  const cls = document.getElementById('noteClass').value.trim() || T('all');
  if(!title){ alert(T('req_fields')); return; }
  db.notes.push({id:uid('n'),title,body,className:cls,date:today()});
  save(); renderNotesList();
  document.getElementById('noteTitle').value = '';
  document.getElementById('noteBody').value = '';
}
function renderNotesList(){
  const el = document.getElementById('notesList');
  const list = db.notes.slice().reverse();
  if(!list.length){ el.innerHTML = '<div class="empty">'+T('no_notes')+'</div>'; return; }
  el.innerHTML = list.map(n=>'<div style="border:1px solid var(--border);padding:12px;border-radius:8px;margin-bottom:8px;">' +
    '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;"><strong>'+n.title+'</strong>' +
    '<span style="font-size:12px;color:var(--muted);">'+T('class')+' '+n.className+' · '+n.date+'</span></div>' +
    (n.body ? '<div style="margin-top:6px;font-size:14px;">'+n.body+'</div>' : '') +
    '<button class="btn danger small" style="margin-top:8px;" onclick="deleteNote(\''+n.id+'\')">'+T('del')+'</button></div>').join('');
}
function deleteNote(id){
  if(!confirm(T('confirm_delete'))) return;
  db.notes = db.notes.filter(n=>n.id!==id); save(); renderNotesList();
}

const DAYS = ['mon','tue','wed','thu','fri','sat'];
const PERIODS = 7;
let ttClass = '';
function renderTimetable(){
  const cls = classes();
  if(!ttClass) ttClass = cls[0] || '';
  if(!db.timetable[ttClass]) db.timetable[ttClass] = {};
  document.getElementById('timetable').innerHTML =
    '<div class="card"><h2>'+T('timetable')+'</h2>' +
    '<div class="toolbar"><label class="field">'+T('class')+'<select onchange="ttClass=this.value; renderTimetable()">' +
    (cls.map(c=>'<option value="'+c+'" '+(c===ttClass?'selected':'')+'>'+T('class')+' '+c+'</option>').join('') || '<option>--</option>') +
    '</select></label></div><div style="overflow-x:auto;"><table><thead><tr><th>'+T('day')+'</th>' +
    Array.from({length:PERIODS},(_,i)=>'<th>'+T('period')+' '+(i+1)+'</th>').join('')+'</tr></thead><tbody>' +
    DAYS.map(d=>'<tr><td><strong>'+T('day_'+d)+'</strong></td>' +
      Array.from({length:PERIODS},(_,i)=>{
        const v = (db.timetable[ttClass][d]||[])[i]||'';
        return '<td><input value="'+v+'" onchange="setTT(\''+d+'\','+i+',this.value)" style="min-width:90px;font-size:12px;padding:5px"></td>';
      }).join('') + '</tr>').join('') +
    '</tbody></table></div></div>';
}
function setTT(day, i, val){
  if(!db.timetable[ttClass]) db.timetable[ttClass] = {};
  if(!db.timetable[ttClass][day]) db.timetable[ttClass][day] = Array(PERIODS).fill('');
  db.timetable[ttClass][day][i] = val; save();
}

// ============ Print ============
function printSection(pageId){
  const page = document.getElementById(pageId);
  const was = page.classList.contains('active');
  if(!was) page.classList.add('active');
  document.body.classList.add('printing');
  page.classList.add('print-target');
  setTimeout(()=>{
    window.print();
    page.classList.remove('print-target');
    document.body.classList.remove('printing');
    if(!was) page.classList.remove('active');
  }, 120);
}

// ============ Backup ============
function exportData(){
  const blob = new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'IPS_backup_'+today()+'.json'; a.click();
  URL.revokeObjectURL(url);
}
function importData(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const data = JSON.parse(r.result);
      if(confirm(T('confirm_delete'))){ db = data; save(); alert(T('saved')); location.reload(); }
    }catch(err){ alert('Invalid file'); }
  };
  r.readAsText(f);
}

// ============ Init ============
(function init(){
  applyLang();
  const savedUser = sessionStorage.getItem('ips_user');
  if(savedUser){
    try{
      CURRENT_USER = JSON.parse(savedUser);
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appScreen').style.display = 'block';
      applyLang();
      renderPage('dashboard');
    }catch(e){}
  }
})();
</script>
